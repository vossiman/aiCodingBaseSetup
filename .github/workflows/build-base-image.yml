# Build & publish ghcr.io/vossiman/devbox-base — the custom devcontainer base
# image (spec: docs/superpowers/specs/2026-08-06-custom-base-image-design.md).
# Publish on change to image/ (PRs build+smoke only, no push); manual dispatch
# for out-of-band rebuilds. No schedule: baked CLI seeds self-update at boot
# via aicoding-sync, so scheduled rebuilds only churned tags (decision
# 2026-08-09) — dispatch manually if a seed ever needs a fresh bake.
# After each publish the workflow pins the blueprint devcontainer.json to
# the new digest and pushes that commit to main itself (machine-generated,
# smoke-tested — same class as the other direct-to-main mechanical bumps).
# devcontainer.json is outside this workflow's paths filter, so the pin
# commit cannot retrigger the build.
name: build-base-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/build-base-image.yml"
  pull_request:
    paths:
      - "image/**"
      - ".github/workflows/build-base-image.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: build-base-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vossiman/devbox-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (Dockerfile + devcontainer features)
        env:
          DEVBOX_BASE_SHA: ${{ github.sha }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_ENV"
          npx -y @devcontainers/cli@0.88.0 build \
            --workspace-folder image \
            --config image/devcontainer.json \
            --platform linux/amd64 \
            --image-name "$IMAGE:$DATE_TAG" \
            --image-name "$IMAGE:latest"

      - name: Smoke test
        run: bash image/smoke-test.sh "$IMAGE:$DATE_TAG"

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:$DATE_TAG"
          docker push "$IMAGE:latest"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$DATE_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          {
            echo "## devbox-base published"
            echo '```'
            echo "$IMAGE:$DATE_TAG"
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo "Blueprint pin is automated (next step); on pin failure, pin manually with the ref above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pin blueprint to published digest
        if: github.event_name != 'pull_request'
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest '$DIGEST'"; exit 1; }
          git pull --rebase origin main
          sed -i -E "s|(ghcr\.io/vossiman/devbox-base@)sha256:[0-9a-f]{64}|\1$DIGEST|" devcontainer.json
          grep -qF "devbox-base@$DIGEST" devcontainer.json || { echo "::error::pin pattern did not match"; exit 1; }
          if git diff --quiet devcontainer.json; then
            echo "digest unchanged ($DIGEST) — nothing to pin"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devcontainer.json
          git commit -m "chore(image): pin devbox-base $DATE_TAG ($DIGEST)"
          git push origin HEAD:main
