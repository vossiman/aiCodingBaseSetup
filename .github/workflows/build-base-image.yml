# Build & publish ghcr.io/vossiman/devbox-base — the custom devcontainer base
# image (spec: docs/superpowers/specs/2026-08-06-custom-base-image-design.md).
# Publish on change to image/ (PRs build+smoke only, no push); manual dispatch
# for out-of-band rebuilds. No schedule: baked CLI seeds self-update at boot
# via aicoding-sync, so scheduled rebuilds only churned tags (decision
# 2026-08-09) — dispatch manually if a seed ever needs a fresh bake.
name: build-base-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/build-base-image.yml"
  pull_request:
    paths:
      - "image/**"
      - ".github/workflows/build-base-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-base-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vossiman/devbox-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (Dockerfile + devcontainer features)
        env:
          DEVBOX_BASE_SHA: ${{ github.sha }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_ENV"
          npx -y @devcontainers/cli@0.88.0 build \
            --workspace-folder image \
            --config image/devcontainer.json \
            --platform linux/amd64 \
            --image-name "$IMAGE:$DATE_TAG" \
            --image-name "$IMAGE:latest"

      - name: Smoke test
        run: bash image/smoke-test.sh "$IMAGE:$DATE_TAG"

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:$DATE_TAG"
          docker push "$IMAGE:latest"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$DATE_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          {
            echo "## devbox-base published"
            echo '```'
            echo "$IMAGE:$DATE_TAG"
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo "Pin the blueprint with the digest ref above (rollout step 2)."
          } >> "$GITHUB_STEP_SUMMARY"
