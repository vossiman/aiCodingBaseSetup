# Build & publish ghcr.io/vossiman/devbox-base — the custom devcontainer base
# image (spec: docs/superpowers/specs/2026-08-06-custom-base-image-design.md).
# Publish on change to image/ (PRs build+smoke only, no push); manual dispatch
# for out-of-band rebuilds. No schedule: baked CLI seeds self-update at boot
# via aicoding-sync, so scheduled rebuilds only churned tags (decision
# 2026-08-09) — dispatch manually if a seed ever needs a fresh bake.
# Every devcontainer.json references :latest, and this workflow moves :latest
# only after the smoke test passes, so :latest is the newest green image.
# Only main publishes: a dispatch from another branch builds and smoke-tests
# but never moves a tag.
name: build-base-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/build-base-image.yml"
  pull_request:
    paths:
      - "image/**"
      - ".github/workflows/build-base-image.yml"

permissions:
  contents: read

concurrency:
  group: build-base-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vossiman/devbox-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (Dockerfile + devcontainer features)
        env:
          DEVBOX_BASE_SHA: ${{ github.sha }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_ENV"
          npx -y @devcontainers/cli@0.88.0 build \
            --workspace-folder image \
            --config image/devcontainer.json \
            --platform linux/amd64 \
            --image-name "$IMAGE:$DATE_TAG" \
            --image-name "$IMAGE:latest"

      - name: Patch docker-init.sh (/tmp on disk, not tmpfs)
        run: |
          docker build -f image/Dockerfile.tmp-on-disk \
            --build-arg BASE="$IMAGE:$DATE_TAG" \
            -t "$IMAGE:$DATE_TAG" -t "$IMAGE:latest" image

      - name: Smoke test
        run: bash image/smoke-test.sh "$IMAGE:$DATE_TAG"

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$DATE_TAG"
          docker push "$IMAGE:latest"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$DATE_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          {
            echo "## devbox-base published"
            echo '```'
            echo "$IMAGE:$DATE_TAG"
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
