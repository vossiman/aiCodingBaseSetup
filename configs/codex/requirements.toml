# aiCodingBaseSetup managed file — do not edit by hand.
# Rewritten by ensure_codex_managed_hooks() (lib/provision-system.sh) on every
# install/sync. Deployed to /etc/codex/requirements.toml (root-owned).
#
# Why this file exists, and why it is not ~/.codex/hooks.json:
# codex gates every NON-managed hook behind a trust hash and silently skips it
# until a human runs /hooks in the TUI — an installed-but-inert hook, which is
# exactly the failure this whole change was made to fix. Hooks sourced from
# requirements.toml are "managed": trusted by policy, no interactive review,
# and not disableable from the user hook browser. Verified against
# codex-cli 0.148.0.
#
# The hook script is the SAME one Claude Code uses: codex implements the same
# PreToolUse contract (tool_name + tool_input.command, and a
# hookSpecificOutput.permissionDecision = "deny" response). Verified by
# feeding a real tool call to codex 0.148.0 and watching it refuse:
#   ERROR codex_core::tools::router: error=Command blocked by PreToolUse hook
#
# `hooks` is a stable, default-on feature in 0.148 (`codex features list`), so
# no [features] block is needed here. allow_managed_hooks_only is deliberately
# NOT set — that would disable the user's own hooks, which is not our call.

[[hooks.PreToolUse]]
# Match every tool: the script itself decides per tool_name. Codex's canonical
# names are Bash and apply_patch (plus mcp__server__tool); the script handles
# the first two and falls through to "allow" for anything it does not know.
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/bw-deny-files.sh"
timeout = 30
statusMessage = "secrets guard"

# Transcript scrubber (redact-sessions) and its pending-rotation notice: the
# same scripts Claude Code runs, wired to codex's matching events. Managed
# for the same reason as the deny hook: a user-level hook sits inert until
# someone runs /hooks. SessionStart stdout becomes developer context; Stop
# scrubs the live rollout in place and sweeps; SessionEnd scrubs and sweeps.
[[hooks.SessionStart]]
matcher = ".*"

[[hooks.SessionStart.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/redact-sessions-pending.sh"
timeout = 5
statusMessage = "pending rotations"

[[hooks.Stop]]
matcher = ".*"

[[hooks.Stop.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/redact-sessions-hook.sh"
timeout = 90
statusMessage = "transcript scrub"

[[hooks.SessionEnd]]
matcher = ".*"

[[hooks.SessionEnd.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/redact-sessions-hook.sh"
# Codex caps SessionEnd at 3s; the script detaches the scrub worker.
timeout = 3
statusMessage = "transcript scrub"

# Shared workflow nudges: same scripts and payload fields as Claude Code.
[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/memory-hint.sh hook:codex"
timeout = 5
statusMessage = "memory hints"

[[hooks.SessionStart]]
matcher = ".*"
[[hooks.SessionStart.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/check-archived-docs.sh"
timeout = 5
statusMessage = "housekeeping"

# Turn start clears the tmux agent-waiting flag (bin/agent-notify --clear);
# the turn-end half is codex's `notify` in config.toml.
[[hooks.UserPromptSubmit]]
matcher = ".*"

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/agent-working.sh"
timeout = 5
statusMessage = "agent working"

# Native Kanban work lifecycle. The shared wrapper performs no parsing or
# network access; kanban-work validates the pinned native payload and journals
# queue intent locally before returning. Codex 0.154.0 has no
# PostToolUseFailure event, so none is configured here.
[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"
[[hooks.SessionStart.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/kanban-work-hook.sh codex SessionStart"
timeout = 10
statusMessage = "Kanban session"

[[hooks.UserPromptSubmit]]
matcher = ".*"
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/kanban-work-hook.sh codex UserPromptSubmit"
timeout = 10
statusMessage = "Kanban activity"

[[hooks.PreToolUse]]
matcher = ".*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/kanban-work-hook.sh codex PreToolUse"
timeout = 10
statusMessage = "Kanban permit"

[[hooks.PostToolUse]]
matcher = ".*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/kanban-work-hook.sh codex PostToolUse"
timeout = 10
statusMessage = "Kanban activity"

[[hooks.Stop]]
matcher = ".*"
[[hooks.Stop.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/kanban-work-hook.sh codex Stop"
timeout = 3
statusMessage = "Kanban handoff"

[[hooks.SessionEnd]]
matcher = ".*"
[[hooks.SessionEnd.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/kanban-work-hook.sh codex SessionEnd"
timeout = 3
statusMessage = "Kanban session end"

[[hooks.SubagentStart]]
matcher = ".*"
[[hooks.SubagentStart.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/kanban-work-hook.sh codex SubagentStart"
timeout = 10
statusMessage = "Kanban child session"

[[hooks.SubagentStop]]
matcher = ".*"
[[hooks.SubagentStop.hooks]]
type = "command"
command = "{{MANAGED_DIR}}/hooks/kanban-work-hook.sh codex SubagentStop"
timeout = 3
statusMessage = "Kanban child end"
