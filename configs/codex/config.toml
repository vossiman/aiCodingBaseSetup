# aiCodingBaseSetup — managed by install.sh. Do not edit directly; your
# edits will be classified as "drifted" by aicoding-sync.
#
# {{HOME}} / {{*_API_KEY}} placeholders are substituted at deploy time by
# lib/blueprint-deploy.sh's deploy_overwrite_file_substituted pipeline.

model = "gpt-5.6-sol"

# Push a phone notification when a turn completes (agent-waiting feature).
# codex invokes argv + one JSON arg; only agent-turn-complete fires. The
# approval-prompt tier stays tmux's job for now (openai/codex#11808 closed
# 2026-02 in favor of the [hooks] feature — stable+default-on since 0.147,
# events incl. PermissionRequest — a candidate replacement for this notify
# wiring, not yet adopted; see docs/agent-release-audits.md 2026-08-18).
notify = ["{{HOME}}/.local/bin/agent-notify", "--source", "codex", "--title", "✔ codex turn done"]

# Historical: setting BOTH keys below once suppressed codex's per-project
# trust screen and its [projects."<path>"].trust_level writes into this file
# (spike-verified on 0.144). Codex 0.147 regressed that: it now auto-trusts
# local projects and persists trust_level regardless (spike-verified
# 2026-08-18). The drift problem is instead handled sync-side —
# compute_managed_hash in lib/blueprint-deploy.sh strips [projects.*]
# sections before drift comparison, so those writes are ignored.
#
# Automode is PROFILE-GATED (2026-08-31). In the devpod container the
# container itself is the isolation boundary, so codex runs with no prompts
# and no sandbox -- same posture as claude's skip-permissions. A host
# profile (WSL, the Mint desktop) has no such boundary: it holds the real
# home directory, real keys and a forwarded ssh-agent, so it gets
# workspace-write + on-request instead. The two values are substituted at
# deploy time from the manifest profile; see _substitute_file_to in
# lib/blueprint-deploy.sh. Values -- approval_policy:
# untrusted|on-request|never; sandbox_mode:
# read-only|workspace-write|danger-full-access.
#
# The deny hook filters agent TOOL CALLS but does not confine child
# processes, so it is not a substitute for the sandbox on a host.
#
# Secrets: codex's default shell_environment_policy strips env vars whose
# names contain KEY/SECRET/TOKEN from commands it runs. Keep that default
# (never set ignore_default_excludes = true). Side effect: `git push` from
# inside codex may fail because the gh credential helper reads GH_TOKEN from
# the (stripped) environment.
approval_policy = "{{CODEX_APPROVAL_POLICY}}"
sandbox_mode = "{{CODEX_SANDBOX_MODE}}"

# Codex-side subagent delegation (stable since 0.145 but default-off;
# adopted 2026-08-18, see docs/agent-release-audits.md). Sub-agent model,
# reasoning effort, and concurrency are tunable via [agents] if needed.
[features]
multi_agent_v2 = true

# Codex has no custom-command statusline (openai/codex#17827) — these
# built-in items approximate the claude/cursor powerline script (context
# bar + limits + branch/PR). Item names spike-verified against the 0.144
# binary. Reconfigure interactively via /statusline (note: codex persists
# that back into this file, which aicoding-sync will classify as drift).
[tui]
status_line = ["run-state", "context-used", "five-hour-limit", "weekly-limit", "branch-changes", "pull-request-number"]
# Inline rendering instead of the alternate screen: in tmux the alt screen
# swallows output into codex's internal viewport, so pane scrollback
# (prefix+[ / mouse) sees nothing. "never" keeps output in the terminal
# where tmux history works. Same effect as the --no-alt-screen flag.
alternate_screen = "never"

[mcp_servers.firecrawl]
command = "firecrawl-mcp"
env = { FIRECRAWL_API_KEY = "{{FIRECRAWL_API_KEY}}" }

[mcp_servers.brave-search]
command = "brave-search-mcp-server"
env = { BRAVE_API_KEY = "{{BRAVE_API_KEY}}" }

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest", "--browser", "chromium"]

# memory-router — central memory-lanes retrieval router on vossisrv (the
# memory_search tool). Streamable HTTP; the bearer token is substituted at
# deploy time (same pipeline as the API keys above) rather than read from the
# environment, so it also works when codex is launched from non-interactive
# contexts that never source ~/.bashrc.d.
[mcp_servers.memory-router]
url = "http://10.0.0.249:8091/mcp"
http_headers = { Authorization = "Bearer {{MEMORY_ROUTER_TOKEN}}" }
